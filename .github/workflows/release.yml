name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish install packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build install packages
        run: |
          set -euo pipefail
          ./scripts/prepare_install_package.sh
          ./scripts/prepare_install_package.sh --tar
          ls -lh udm-vpn-monitor.zip udm-vpn-monitor.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            udm-vpn-monitor.zip
            udm-vpn-monitor.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true
